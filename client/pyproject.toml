[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "company-brain-client"
version = "0.1.0"
description = "Company Brain desktop client"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.27,<1"]

[project.scripts]
company-brain-client = "company_brain_client.app:main"

[tool.setuptools.packages.find]
include = ["company_brain_client"]
namespaces = false
